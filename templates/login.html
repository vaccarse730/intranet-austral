<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login - Intranet</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 96%; padding: 10px; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        a { display: block; margin-top: 15px; color: #28a745; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔒 Iniciar Sesión</h2>
        <form method="POST">
            <input type="text" name="usuario" placeholder="Usuario (empleado)" required><br>
            <input type="password" name="clave" placeholder="Contraseña (1234)" required><br>
            <button type="submit">Entrar</button>
        </form>
        <a href="/registro">¿Eres nuevo? Regístrate aquí</a>
    </div>
</body>
</html>
